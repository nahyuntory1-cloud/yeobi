<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여비 정산 신청서</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic','맑은 고딕',sans-serif; background:#eaf4f4; min-height:100vh; }

.page-header { background:#5BBCBF; color:white; padding:15px 18px; font-size:16px; font-weight:bold; }

/* API 키 배너 */
.key-banner { background:#e8f8f0; border-left:4px solid #27ae60; padding:10px 16px; font-size:13px; color:#1a5c3a; margin:10px; border-radius:6px; }
.key-banner .kb-row { display:flex; gap:8px; margin-top:6px; }
.key-banner input { flex:1; border:1px solid #27ae60; border-radius:6px; padding:6px 10px; font-size:13px; font-family:inherit; outline:none; }
.key-banner button { background:#27ae60; border:none; border-radius:6px; padding:6px 14px; font-size:13px; cursor:pointer; font-weight:bold; color:white; }

/* 섹션 */
.section { background:white; margin:10px; border-radius:6px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.section-title { background:#5BBCBF; color:white; padding:9px 16px; font-size:13px; font-weight:bold; }

/* 필드 */
.field { padding:12px 16px; border-bottom:1px solid #f0f0f0; position:relative; }
.field:last-child { border-bottom:none; }
.field label { display:block; font-size:12px; color:#888; margin-bottom:5px; }
.field input,.field select { width:100%; border:none; outline:none; font-size:15px; font-family:inherit; background:transparent; color:#222; }
.field input[type=number] { -moz-appearance:textfield; }
.field input[type=number]::-webkit-outer-spin-button,
.field input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }

/* 위치 행 */
.loc-row { display:flex; gap:8px; align-items:flex-start; }
.loc-row .ac-wrap { flex:1; position:relative; }
.map-btn { background:#5BBCBF; border:none; border-radius:8px; color:white; font-size:18px; width:40px; height:40px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.map-btn:hover { background:#3fa0a3; }

/* 자동완성 */
.ac-list { position:absolute; top:calc(100% + 4px); left:0; right:0; background:white; border:1px solid #ddd; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:500; max-height:220px; overflow-y:auto; }
.ac-item { padding:10px 14px; font-size:13px; cursor:pointer; border-bottom:1px solid #f5f5f5; line-height:1.4; }
.ac-item:hover { background:#f0fafa; }
.ac-item:last-child { border-bottom:none; }
.ac-item .main { font-weight:600; color:#222; }
.ac-item .sub { color:#999; font-size:11px; margin-top:1px; }

/* 대중교통비 배지 */
.fare-badge { display:none; margin-top:8px; background:#e8f8f8; border:1px solid #5BBCBF; border-radius:20px; padding:4px 12px; font-size:12px; color:#1a7a7a; font-weight:600; }
.fare-badge.v { display:inline-block; }
#fare-apply-btn { display:none; margin-left:8px; background:#5BBCBF; color:white; border:none; border-radius:14px; padding:3px 12px; font-size:12px; cursor:pointer; }

/* 운임 */
.tr-row { border-bottom:1px solid #f0f0f0; }
.tr-row:last-child { border-bottom:none; }
.tr-header { display:flex; justify-content:space-between; align-items:center; padding:10px 16px 4px; }
.tr-label { font-size:12px; color:#888; }
.tr-del { background:none; border:none; color:#ccc; font-size:18px; cursor:pointer; }
.tr-del:hover { color:#e44; }
.tr-fields { display:grid; grid-template-columns:1fr 1fr; }
.tr-field { padding:6px 16px 12px; }
.tr-field label { font-size:11px; color:#aaa; display:block; margin-bottom:3px; }
.tr-field input,.tr-field select { width:100%; border:none; outline:none; font-size:14px; font-family:inherit; background:transparent; }
.add-row-btn { display:block; width:calc(100% - 32px); margin:10px 16px; background:none; border:1.5px dashed #5BBCBF; color:#5BBCBF; padding:9px; border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit; }
.add-row-btn:hover { background:#f0fafa; }

/* 하단 버튼 */
.action-bar { padding:14px; }
.btn-main { width:100%; background:#5BBCBF; color:white; border:none; padding:15px; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; font-family:inherit; }
.btn-main:hover { background:#3fa0a3; }

/* 지도 모달 */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; flex-direction:column; }
.modal-overlay.open { display:flex; }
.modal-box { background:white; flex:1; display:flex; flex-direction:column; max-height:100dvh; }
.modal-head { background:#5BBCBF; color:white; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:15px; flex-shrink:0; }
.modal-close { background:none; border:none; color:white; font-size:22px; cursor:pointer; }
.map-search-bar { padding:10px 12px; border-bottom:1px solid #eee; flex-shrink:0; }
.map-search-bar input { width:100%; padding:10px 14px; border:1.5px solid #ddd; border-radius:8px; font-size:14px; font-family:inherit; outline:none; }
.map-search-bar input:focus { border-color:#5BBCBF; }
.map-results { padding:0 12px 6px; flex-shrink:0; max-height:180px; overflow-y:auto; }
.map-result-item { padding:9px 10px; font-size:13px; cursor:pointer; border-radius:6px; margin-bottom:2px; border:1px solid #f0f0f0; }
.map-result-item:hover { background:#f0fafa; }
.map-result-item .rn { font-weight:600; }
.map-result-item .ra { font-size:11px; color:#aaa; margin-top:2px; }
#vmap { flex:1; min-height:250px; }
.map-footer { padding:10px 14px; border-top:1px solid #eee; display:flex; align-items:center; gap:10px; flex-shrink:0; }
.sel-name { flex:1; font-size:13px; color:#555; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.map-confirm { background:#5BBCBF; color:white; border:none; padding:10px 22px; border-radius:8px; font-size:14px; cursor:pointer; font-family:inherit; }
.map-cancel { background:#999; color:white; border:none; padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; font-family:inherit; }

/* 문서 모달 */
.doc-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2000; overflow-y:auto; }
.doc-overlay.open { display:block; }
.doc-action-bar { position:sticky; top:0; background:rgba(0,0,0,.8); padding:10px 16px; display:flex; gap:8px; justify-content:flex-end; z-index:10; }
.doc-action-bar button { border:none; padding:9px 18px; border-radius:6px; font-size:13px; cursor:pointer; font-family:inherit; }
.btn-print { background:#5BBCBF; color:white; }
.btn-close2 { background:#666; color:white; }

/* 문서 */
.doc-paper { background:white; max-width:780px; margin:0 auto 30px; padding:36px 36px 40px; }
.doc-h1 { text-align:center; font-size:22px; font-weight:bold; margin-bottom:22px; letter-spacing:2px; }
.doc-tbl { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:18px; }
.doc-tbl td { border:1px solid #555; padding:6px 8px; text-align:center; vertical-align:middle; line-height:1.5; }
.doc-tbl .lbl { background:#f5f7f7; font-weight:bold; font-size:12px; }
.doc-tbl .left { text-align:left; padding-left:10px; }
.doc-legal { font-size:13px; line-height:2; margin-bottom:10px; }
.doc-attach { font-size:13px; margin-bottom:30px; }
.doc-sign { text-align:right; font-size:14px; margin-bottom:24px; line-height:2.4; }
.doc-notes { font-size:11.5px; color:#444; line-height:1.9; border-top:1px solid #bbb; padding-top:10px; }

@media print {
  .doc-action-bar { display:none !important; }
  .doc-overlay { display:block !important; position:static; background:none; overflow:visible; }
  body > *:not(.doc-overlay) { display:none !important; }
  .doc-paper { box-shadow:none; margin:0; padding:20px; }
}
</style>
</head>
<body>

<div class="page-header">여비 정산 신청 (기본 정보)</div>


<!-- 기본 정보 -->
<div class="section">
  <div class="field"><label>소속</label><input id="f-org" type="text" placeholder="소속을 입력하세요"></div>
  <div class="field"><label>직급 (직위)</label><input id="f-rank" type="text" placeholder="예) 행정6급"></div>
  <div class="field"><label>성명</label><input id="f-name" type="text" placeholder="성명을 입력하세요"></div>
  <div class="field"><label>날짜</label><input id="f-date" type="date"></div>
</div>

<!-- 위치 -->
<div class="section">
  <div class="field">
    <label>출발지</label>
    <div class="loc-row">
      <div class="ac-wrap">
        <input id="f-dep" type="text" placeholder="출발지를 검색하세요" autocomplete="off" oninput="acSearch(this,'dep')">
        <div class="ac-list" id="ac-dep"></div>
      </div>
      <button class="map-btn" onclick="openMap('dep')" title="지도에서 선택">🗺️</button>
    </div>
  </div>
  <div class="field">
    <label>출장지 (도착지)</label>
    <div class="loc-row">
      <div class="ac-wrap">
        <input id="f-dst" type="text" placeholder="출장지를 검색하세요" autocomplete="off" oninput="acSearch(this,'dst')">
        <div class="ac-list" id="ac-dst"></div>
      </div>
      <button class="map-btn" onclick="openMap('dst')" title="지도에서 선택">🗺️</button>
    </div>
    <div id="fare-result" style="margin-top:8px; display:none;">
      <span class="fare-badge v" id="fare-badge">🚌 계산 중...</span>
      <span id="fare-detail" style="font-size:11px; color:#888; margin-left:6px;"></span>
      <button onclick="applyFare()" id="fare-apply-btn">운임에 적용</button>
    </div>
  </div>
</div>

<!-- 숙박비 -->
<div class="section">
  <div class="section-title">숙박비</div>
  <div class="field"><label>상한액 또는 지급받은 선금 (원)</label><input id="f-lodg-adv" type="number" placeholder="0"></div>
  <div class="field"><label>실제 소요액 (원)</label><input id="f-lodg-act" type="number" placeholder="0"></div>
  <div class="field"><label>초과지출사유</label><input id="f-lodg-rsn" type="text" placeholder="해당 시 입력"></div>
</div>

<!-- 식비 -->
<div class="section">
  <div class="section-title">식비</div>
  <div class="field"><label>지급받은 금액 (원)</label><input id="f-meal-adv" type="number" placeholder="0"></div>
  <div class="field"><label>실제 소요액 (원)</label><input id="f-meal-act" type="number" placeholder="0"></div>
  <div class="field"><label>초과지출사유</label><input id="f-meal-rsn" type="text" placeholder="해당 시 입력"></div>
</div>

<!-- 운임 -->
<div class="section">
  <div class="section-title">운임</div>
  <div id="tr-list"></div>
  <button class="add-row-btn" onclick="addTrRow()">＋ 운임 행 추가</button>
</div>

<div class="action-bar">
  <button class="btn-main" onclick="showDoc()">📄 여비정산신청서 미리보기 / 인쇄</button>
</div>

<!-- 지도 모달 -->
<div class="modal-overlay" id="map-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="map-title">위치 선택</span>
      <button class="modal-close" onclick="closeMap()">✕</button>
    </div>
    <div class="map-search-bar">
      <input id="map-input" type="text" placeholder="장소명을 입력하세요 (예: 경기도교육청)" oninput="mapSearch(this.value)">
    </div>
    <div class="map-results" id="map-results"></div>
    <div id="vmap"></div>
    <div class="map-footer">
      <div class="sel-name" id="sel-name">장소를 검색하거나 지도를 클릭하세요</div>
      <button class="map-confirm" onclick="confirmMap()">확인</button>
      <button class="map-cancel" onclick="closeMap()">취소</button>
    </div>
  </div>
</div>

<!-- 문서 모달 -->
<div class="doc-overlay" id="doc-modal">
  <div class="doc-action-bar">
    <button class="btn-print" onclick="window.print()">🖨️ 인쇄</button>
    <button class="btn-close2" onclick="closeDoc()">✕ 닫기</button>
  </div>
  <div class="doc-paper" id="doc-paper"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ═══════════════ 상태 ═══════════════ */
let vworldKey = '5BEF0188-E9DA-3090-8E79-F3700A62ED34';
let leafMap   = null;
let leafMark  = null;
let mapTarget = null;
let selLoc    = { name:'', lat:null, lng:null };
let depCoord  = null;
let dstCoord  = null;
let fareResult= null;
let trRows    = [];
let trIdx     = 0;
let acTimers  = {};
let mapTimer  = null;

const TRANSPORT = {
  bus:   { label:'버스',     cat:'대중교통비' },
  subway:{ label:'지하철',   cat:'대중교통비' },
  ktx:   { label:'KTX/기차', cat:'대중교통비' },
  ship:  { label:'선박',     cat:'대중교통비' },
  car:   { label:'자가용',   cat:'자가운임'   },
  taxi:  { label:'택시',     cat:'택시비'     },
  plane: { label:'항공기',   cat:'항공운임'   },
};

/* ═══════════════ 초기화 ═══════════════ */
document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
document.getElementById('fare-result').style.display = 'none';
addTrRow();

document.addEventListener('click', e => {
  if (!e.target.closest('.ac-wrap'))
    document.querySelectorAll('.ac-list').forEach(el => el.innerHTML = '');
});

/* ═══════════════ 브이월드 키 ═══════════════ */
function applyVworldKey() {
  const k = document.getElementById('vworld-key-input').value.trim();
  if (!k) { alert('인증키를 입력해 주세요.'); return; }
  vworldKey = k;
  document.getElementById('key-banner').style.display = 'none';
  // 지도가 열려있으면 타일 교체
  if (leafMap) {
    leafMap.eachLayer(l => { if (l._url) leafMap.removeLayer(l); });
    getVworldTile().addTo(leafMap);
  }
  alert('✅ 브이월드 인증키가 적용되었습니다!');
}

function getVworldTile() {
  if (vworldKey) {
    return L.tileLayer(
      `https://api.vworld.kr/req/wmts/1.0.0/${vworldKey}/Base/{z}/{y}/{x}.png`,
      { maxZoom:19, attribution:'© 국토지리정보원 VWorld' }
    );
  }
  return L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom:19, attribution:'© OpenStreetMap contributors' }
  );
}

/* ═══════════════ 장소 검색: Nominatim → Photon (둘 다 CORS 완전 허용) ═══════════════ */
async function searchPlaces(q, size=5) {
  // 1순위: Nominatim — "한국" 추가로 검색 정확도 향상
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' 한국')}&format=json&limit=${size}&accept-language=ko&addressdetails=1`
    );
    if (r.ok) {
      const data = await r.json();
      if (data.length) return data.map(d => ({
        title: d.name || d.display_name.split(',')[0].trim(),
        addr:  d.display_name.split(',').slice(1, 4).join(' ').trim(),
        lat:   parseFloat(d.lat),
        lng:   parseFloat(d.lon)
      }));
    }
  } catch {}

  // 2순위: Photon (Komoot/OSM) — 한국어 지원, CORS 완전 허용, 한국 좌표 중심
  try {
    const r = await fetch(
      `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lang=ko&limit=${size}&lat=37.5&lon=127.0`
    );
    if (r.ok) {
      const d = await r.json();
      if (d.features?.length) return d.features
        .filter(f => f.geometry?.coordinates)
        .map(f => {
          const p = f.properties;
          return {
            title: p.name || p.city || q,
            addr:  [p.street, p.city, p.state].filter(Boolean).join(' '),
            lat:   f.geometry.coordinates[1],
            lng:   f.geometry.coordinates[0]
          };
        });
    }
  } catch {}

  return [];
}

/* ═══════════════ 자동완성 ═══════════════ */
function acSearch(input, key) {
  clearTimeout(acTimers[key]);
  const q = input.value.trim();
  const el = document.getElementById('ac-' + key);
  if (q.length < 2) { el.innerHTML=''; return; }

  acTimers[key] = setTimeout(async () => {
    const items = await searchPlaces(q, 6);
    if (!items.length) { el.innerHTML='<div class="ac-item" style="color:#aaa;">검색 결과 없음</div>'; return; }
    el.innerHTML = items.map(p =>
      `<div class="ac-item" onclick="pickAc('${key}','${esc(p.title)}',${p.lat},${p.lng})">
        <div class="main">📍 ${p.title}</div>
        ${p.addr ? `<div class="sub">${p.addr}</div>` : ''}
      </div>`
    ).join('');
  }, 380);
}

function pickAc(key, name, lat, lng) {
  document.getElementById('f-'+key).value = name;
  document.getElementById('ac-'+key).innerHTML = '';
  if (key==='dep') depCoord={lat:+lat,lng:+lng};
  if (key==='dst') dstCoord={lat:+lat,lng:+lng};
  tryFareCalc();
}

/* ═══════════════ 지도 모달 ═══════════════ */
function openMap(target) {
  mapTarget = target;
  selLoc = { name:'', lat:null, lng:null };
  document.getElementById('map-title').textContent = target==='dep' ? '출발지 선택' : '출장지 선택';
  document.getElementById('sel-name').textContent  = '장소를 검색하거나 지도를 클릭하세요';
  document.getElementById('map-input').value = '';
  document.getElementById('map-results').innerHTML = '';
  document.getElementById('map-modal').classList.add('open');

  setTimeout(() => {
    if (!leafMap) {
      leafMap = L.map('vmap').setView([37.5665, 126.9780], 12);
      getVworldTile().addTo(leafMap);
      leafMap.on('click', e => placePin(e.latlng.lat, e.latlng.lng, null));
    } else {
      leafMap.invalidateSize();
    }
    const cur = document.getElementById('f-'+target).value;
    if (cur) { document.getElementById('map-input').value=cur; mapSearch(cur); }
  }, 200);
}

function closeMap() { document.getElementById('map-modal').classList.remove('open'); }

function placePin(lat, lng, name) {
  if (leafMark) leafMap.removeLayer(leafMark);
  leafMark = L.marker([lat,lng]).addTo(leafMap);
  leafMap.setView([lat,lng], 15);
  selLoc = { lat, lng, name: name || '' };
  if (name) {
    document.getElementById('sel-name').textContent = name;
  } else {
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ko`)
      .then(r=>r.json())
      .then(d => {
        const n = d.name || d.display_name.split(',')[0];
        selLoc.name = n;
        document.getElementById('sel-name').textContent = n;
      }).catch(()=>{});
  }
}

async function mapSearch(q) {
  clearTimeout(mapTimer);
  const el = document.getElementById('map-results');
  if (!q || q.trim().length < 2) { el.innerHTML=''; return; }
  mapTimer = setTimeout(async () => {
    const items = await searchPlaces(q, 5);
    if (!items.length) { el.innerHTML='<div style="padding:8px;font-size:12px;color:#aaa;">검색 결과 없음</div>'; return; }
    el.innerHTML = items.map(p =>
      `<div class="map-result-item" onclick="placePin(${p.lat},${p.lng},'${esc(p.title)}');document.getElementById('map-results').innerHTML=''">
        <div class="rn">📍 ${p.title}</div>
        <div class="ra">${p.addr}</div>
      </div>`
    ).join('');
  }, 380);
}

function confirmMap() {
  if (selLoc.name) {
    document.getElementById('f-'+mapTarget).value = selLoc.name;
    if (mapTarget==='dep') depCoord={lat:selLoc.lat,lng:selLoc.lng};
    if (mapTarget==='dst') dstCoord={lat:selLoc.lat,lng:selLoc.lng};
    tryFareCalc();
  }
  closeMap();
}

/* ═══════════════ 대중교통비 자동 계산 ═══════════════ */
function haversineKm(a,b,c,d){
  const R=6371,dLat=(c-a)*Math.PI/180,dLng=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function estimateFare(km) {
  const real = km * 1.35;
  if (real<=10) return { bus:1550, desc:`약 ${real.toFixed(1)}km (기본요금)` };
  if (real<=40) { const f=1550+Math.ceil((real-10)/5)*100; return { bus:f, desc:`약 ${real.toFixed(1)}km` }; }
  if (real<=100) { const f=Math.round(real*80/100)*100; return { bus:f, desc:`약 ${real.toFixed(1)}km (시외)` }; }
  return { bus:Math.round(real*70/100)*100, desc:`약 ${real.toFixed(1)}km (고속)` };
}

async function geocode(q) {
  const items = await searchPlaces(q, 1);
  if (items.length) return { lat: items[0].lat, lng: items[0].lng };
  return null;
}

async function tryFareCalc() {
  const dep = document.getElementById('f-dep').value.trim();
  const dst = document.getElementById('f-dst').value.trim();
  const el  = document.getElementById('fare-result');
  if (!dep || !dst) { el.style.display='none'; fareResult=null; return; }

  el.style.display='block';
  document.getElementById('fare-badge').textContent='🔍 계산 중...';
  document.getElementById('fare-apply-btn').style.display='none';

  if (!depCoord) depCoord = await geocode(dep);
  if (!dstCoord) dstCoord = await geocode(dst);

  if (depCoord && dstCoord) {
    const km  = haversineKm(depCoord.lat,depCoord.lng,dstCoord.lat,dstCoord.lng);
    const est = estimateFare(km);
    fareResult = est;
    document.getElementById('fare-badge').textContent = `🚌 버스 예상 ${est.bus.toLocaleString()}원`;
    document.getElementById('fare-detail').textContent = est.desc;
    document.getElementById('fare-apply-btn').style.display='inline-block';
  } else {
    document.getElementById('fare-badge').textContent='📍 지도에서 장소를 선택하면 더 정확합니다';
  }
}

function applyFare() {
  if (!fareResult || !trRows.length) return;
  trRows[0].amt  = fareResult.bus;
  trRows[0].type = 'bus';
  renderTrRows();
}

/* ═══════════════ 운임 행 ═══════════════ */
function addTrRow() {
  trRows.push({ id:trIdx++, type:'bus', amt:'', grade:'' });
  renderTrRows();
}
function removeTrRow(id) { trRows=trRows.filter(r=>r.id!==id); renderTrRows(); }
function setTrType(id,v) { trRows.find(r=>r.id===id).type=v; renderTrRows(); }
function setTrAmt(id,v)  { trRows.find(r=>r.id===id).amt=v; }
function setTrGrade(id,v){ trRows.find(r=>r.id===id).grade=v; }

function renderTrRows() {
  document.getElementById('tr-list').innerHTML = trRows.map((row,i) => `
    <div class="tr-row">
      <div class="tr-header">
        <span class="tr-label">운임 ${i+1}</span>
        ${trRows.length>1?`<button class="tr-del" onclick="removeTrRow(${row.id})">×</button>`:''}
      </div>
      <div class="tr-fields">
        <div class="tr-field">
          <label>교통편</label>
          <select onchange="setTrType(${row.id},this.value)">
            ${Object.entries(TRANSPORT).map(([k,v])=>`<option value="${k}" ${row.type===k?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
        <div class="tr-field">
          <label>금액 (원)</label>
          <input type="number" value="${row.amt||''}" placeholder="0" oninput="setTrAmt(${row.id},this.value)">
        </div>
      </div>
      <div class="tr-fields">
        <div class="tr-field">
          <label>내역 (자동)</label>
          <input type="text" value="${TRANSPORT[row.type].cat}" readonly style="color:#1a9a9a;font-weight:600;font-size:13px;">
        </div>
        <div class="tr-field">
          <label>등급 (선택)</label>
          <input type="text" value="${row.grade||''}" placeholder="일반/특실 등" oninput="setTrGrade(${row.id},this.value)">
        </div>
      </div>
    </div>`).join('');
}

/* ═══════════════ 문서 생성 ═══════════════ */
const fmtDate  = s => { if(!s)return''; const d=new Date(s); return `${d.getFullYear()}년 ${String(d.getMonth()+1).padStart(2,'0')}월 ${String(d.getDate()).padStart(2,'0')}일`; };
const fmtShort = s => { if(!s)return''; const d=new Date(s); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
const fmtMoney = v => (!v||v==0)?'': `${parseInt(v).toLocaleString()}원`;
const esc = s => (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
