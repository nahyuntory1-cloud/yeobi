<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여비 정산 신청서</title>
<!-- 카카오맵 SDK: YOUR_KAKAO_KEY 자리에 발급받은 JavaScript 키를 입력하세요 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a30cf3b73f9ad9b5e905e8100e5b67a6&libraries=services"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background: #eaf4f4; min-height: 100vh; }

/* ── Header ── */
.page-header {
  background: #5BBCBF;
  color: white;
  padding: 15px 18px;
  font-size: 16px;
  font-weight: bold;
}


/* ── Section card ── */
.section { background: white; margin: 10px; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.section-title { background: #5BBCBF; color: white; padding: 9px 16px; font-size: 13px; font-weight: bold; }

/* ── Field ── */
.field { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; position: relative; }
.field:last-child { border-bottom: none; }
.field label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; border: none; outline: none;
  font-size: 15px; font-family: inherit; background: transparent; color: #222;
}
.field input[type="number"] { -moz-appearance: textfield; }
.field input[type="number"]::-webkit-outer-spin-button,
.field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

/* ── Location row ── */
.loc-row { display: flex; gap: 8px; align-items: flex-start; }
.loc-row .ac-wrap { flex: 1; position: relative; }
.map-btn {
  background: #5BBCBF; border: none; border-radius: 8px; color: white;
  font-size: 18px; width: 40px; height: 40px; cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.map-btn:hover { background: #3fa0a3; }

/* ── Transit fare badge ── */
.fare-badge {
  display: none;
  margin-top: 8px;
  background: #e8f8f8;
  border: 1px solid #5BBCBF;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  color: #1a7a7a;
  font-weight: 600;
}
.fare-badge.visible { display: inline-block; }
.fare-loading { color: #aaa; font-size: 12px; margin-top: 6px; }

/* ── Autocomplete ── */
.ac-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: white; border: 1px solid #ddd; border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12); z-index: 500;
  overflow: hidden; max-height: 220px; overflow-y: auto;
}
.ac-item { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f5f5f5; line-height: 1.4; }
.ac-item:hover { background: #f0fafa; }
.ac-item:last-child { border-bottom: none; }
.ac-item .main { font-weight: 600; color: #222; }
.ac-item .sub { color: #999; font-size: 11px; margin-top: 1px; }

/* ── Transport row ── */
.tr-row { border-bottom: 1px solid #f0f0f0; }
.tr-row:last-child { border-bottom: none; }
.tr-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 4px; }
.tr-label { font-size: 12px; color: #888; }
.tr-del { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; }
.tr-del:hover { color: #e44; }
.tr-fields { display: grid; grid-template-columns: 1fr 1fr; }
.tr-field { padding: 6px 16px 12px; }
.tr-field label { font-size: 11px; color: #aaa; display: block; margin-bottom: 3px; }
.tr-field input, .tr-field select { width: 100%; border: none; outline: none; font-size: 14px; font-family: inherit; background: transparent; }
.add-row-btn {
  display: block; width: calc(100% - 32px); margin: 10px 16px;
  background: none; border: 1.5px dashed #5BBCBF; color: #5BBCBF;
  padding: 9px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.add-row-btn:hover { background: #f0fafa; }

/* ── Action bar ── */
.action-bar { padding: 14px; display: flex; gap: 10px; }
.btn-main {
  flex: 1; background: #5BBCBF; color: white; border: none;
  padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold;
  cursor: pointer; font-family: inherit; transition: background 0.2s;
}
.btn-main:hover { background: #3fa0a3; }

/* ── Map Modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; flex-direction: column; }
.modal-overlay.open { display: flex; }
.modal-box { background: white; flex: 1; display: flex; flex-direction: column; max-height: 100dvh; }
.modal-head {
  background: #5BBCBF; color: white; padding: 14px 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: bold; font-size: 15px; flex-shrink: 0;
}
.modal-close { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
.map-search-bar { padding: 10px 12px; border-bottom: 1px solid #eee; flex-shrink: 0; }
.map-search-bar input {
  width: 100%; padding: 10px 14px; border: 1.5px solid #ddd;
  border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
}
.map-search-bar input:focus { border-color: #5BBCBF; }
.map-results { padding: 0 12px 6px; flex-shrink: 0; max-height: 180px; overflow-y: auto; }
.map-result-item { padding: 9px 10px; font-size: 13px; cursor: pointer; border-radius: 6px; margin-bottom: 2px; border: 1px solid #f0f0f0; }
.map-result-item:hover { background: #f0fafa; }
.map-result-item .place-name { font-weight: 600; }
.map-result-item .place-addr { font-size: 11px; color: #aaa; margin-top: 2px; }
#kakao-map { flex: 1; min-height: 250px; }
.map-footer { padding: 10px 14px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.sel-name { flex: 1; font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-confirm { background: #5BBCBF; color: white; border: none; padding: 10px 22px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }
.map-cancel { background: #999; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }

/* ── Doc Modal ── */
.doc-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; overflow-y: auto; }
.doc-overlay.open { display: block; }
.doc-action-bar { position: sticky; top: 0; background: rgba(0,0,0,0.8); padding: 10px 16px; display: flex; gap: 8px; justify-content: flex-end; z-index: 10; }
.doc-action-bar button { border: none; padding: 9px 18px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; }
.btn-print { background: #5BBCBF; color: white; }
.btn-close2 { background: #666; color: white; }

/* ── Document ── */
.doc-paper { background: white; max-width: 780px; margin: 0 auto 30px; padding: 36px 36px 40px; }
.doc-h1 { text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 22px; letter-spacing: 2px; }
.doc-tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
.doc-tbl td, .doc-tbl th { border: 1px solid #555; padding: 6px 8px; text-align: center; vertical-align: middle; line-height: 1.5; }
.doc-tbl .lbl { background: #f5f7f7; font-weight: bold; font-size: 12px; }
.doc-tbl .left { text-align: left; padding-left: 10px; }
.doc-legal { font-size: 13px; line-height: 2; margin-bottom: 10px; }
.doc-attach { font-size: 13px; margin-bottom: 30px; }
.doc-sign { text-align: right; font-size: 14px; margin-bottom: 24px; line-height: 2.4; }
.doc-notes { font-size: 11.5px; color: #444; line-height: 1.9; border-top: 1px solid #bbb; padding-top: 10px; }

/* ── Print ── */
@media print {
  .doc-action-bar { display: none !important; }
  .doc-overlay { display: block !important; position: static; background: none; overflow: visible; }
  body > *:not(.doc-overlay) { display: none !important; }
  .doc-paper { box-shadow: none; margin: 0; padding: 20px; }
}
</style>
</head>
<body>

<div class="page-header">여비 정산 신청 (기본 정보)</div>

<!-- ── 기본 정보 ── -->
<div class="section">
  <div class="field"><label>소속</label><input id="f-org" type="text" placeholder="소속을 입력하세요"></div>
  <div class="field"><label>직급 (직위)</label><input id="f-rank" type="text" placeholder="예) 행정6급"></div>
  <div class="field"><label>성명</label><input id="f-name" type="text" placeholder="성명을 입력하세요"></div>
  <div class="field"><label>날짜</label><input id="f-date" type="date"></div>
</div>

<!-- ── 위치 ── -->
<div class="section">
  <div class="field">
    <label>출발지</label>
    <div class="loc-row">
      <div class="ac-wrap">
        <input id="f-dep" type="text" placeholder="출발지를 검색하세요" autocomplete="off"
          oninput="acSearch(this,'dep')" onchange="tryFareCalc()">
        <div class="ac-list" id="ac-dep"></div>
      </div>
      <button class="map-btn" onclick="openMap('dep')" title="카카오맵에서 선택">🗺️</button>
    </div>
  </div>
  <div class="field">
    <label>출장지 (도착지)</label>
    <div class="loc-row">
      <div class="ac-wrap">
        <input id="f-dst" type="text" placeholder="출장지를 검색하세요" autocomplete="off"
          oninput="acSearch(this,'dst')" onchange="tryFareCalc()">
        <div class="ac-list" id="ac-dst"></div>
      </div>
      <button class="map-btn" onclick="openMap('dst')" title="카카오맵에서 선택">🗺️</button>
    </div>
    <!-- 대중교통비 자동 계산 결과 -->
    <div id="fare-result" style="margin-top:8px; display:none;">
      <span class="fare-badge visible" id="fare-badge">🚌 계산 중...</span>
      <span id="fare-detail" style="font-size:11px; color:#888; margin-left:6px;"></span>
      <button onclick="applyFare()" id="fare-apply-btn"
        style="display:none; margin-left:8px; background:#5BBCBF; color:white; border:none; border-radius:14px; padding:3px 12px; font-size:12px; cursor:pointer;">
        운임에 적용
      </button>
    </div>
  </div>
</div>

<!-- ── 숙박비 ── -->
<div class="section">
  <div class="section-title">숙박비</div>
  <div class="field"><label>상한액 또는 지급받은 선금 (원)</label><input id="f-lodg-adv" type="number" placeholder="0"></div>
  <div class="field"><label>실제 소요액 (원)</label><input id="f-lodg-act" type="number" placeholder="0"></div>
  <div class="field"><label>초과지출사유</label><input id="f-lodg-rsn" type="text" placeholder="해당 시 입력"></div>
</div>

<!-- ── 식비 ── -->
<div class="section">
  <div class="section-title">식비</div>
  <div class="field"><label>지급받은 금액 (원)</label><input id="f-meal-adv" type="number" placeholder="0"></div>
  <div class="field"><label>실제 소요액 (원)</label><input id="f-meal-act" type="number" placeholder="0"></div>
  <div class="field"><label>초과지출사유</label><input id="f-meal-rsn" type="text" placeholder="해당 시 입력"></div>
</div>

<!-- ── 운임 ── -->
<div class="section">
  <div class="section-title">운임</div>
  <div id="tr-list"></div>
  <button class="add-row-btn" onclick="addTrRow()">＋ 운임 행 추가</button>
</div>

<div class="action-bar">
  <button class="btn-main" onclick="showDoc()">📄 여비정산신청서 미리보기 / 인쇄</button>
</div>

<!-- ── 카카오맵 Modal ── -->
<div class="modal-overlay" id="map-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="map-title">위치 선택</span>
      <button class="modal-close" onclick="closeMap()">✕</button>
    </div>
    <div class="map-search-bar">
      <input id="map-input" type="text" placeholder="장소명을 입력하세요 (예: 서연중학교)" oninput="mapSearch(this.value)">
    </div>
    <div class="map-results" id="map-results"></div>
    <div id="kakao-map"></div>
    <div class="map-footer">
      <div class="sel-name" id="sel-name">장소를 검색하거나 지도를 클릭하세요</div>
      <button class="map-confirm" onclick="confirmMap()">확인</button>
      <button class="map-cancel" onclick="closeMap()">취소</button>
    </div>
  </div>
</div>

<!-- ── Doc Modal ── -->
<div class="doc-overlay" id="doc-modal">
  <div class="doc-action-bar">
    <button class="btn-print" onclick="window.print()">🖨️ 인쇄</button>
    <button class="btn-close2" onclick="closeDoc()">✕ 닫기</button>
  </div>
  <div class="doc-paper" id="doc-paper"></div>
</div>

<script>
/* ═══════════════════════════════════════
   카카오맵 초기화
═══════════════════════════════════════ */
let kakaoReady = false;
let kakaoMap = null;
let kakaoMarker = null;
let kakaoGeocoder = null;
let kakaoPS = null; // PlacesService

function initKakao() {
  try {
    if (typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.services) return false;
    kakaoGeocoder = new kakao.maps.services.Geocoder();
    kakaoPS       = new kakao.maps.services.Places();
    kakaoReady    = true;
    console.log('✅ 카카오맵 준비 완료');
    return true;
  } catch(e) {
    return false;
  }
}

// SDK가 완전히 로드된 뒤 초기화 (최대 5초 재시도)
(function waitKakao(tries) {
  if (initKakao()) return;
  if (tries > 0) setTimeout(() => waitKakao(tries - 1), 500);
})(10);

/* ═══════════════════════════════════════
   State
═══════════════════════════════════════ */
let mapTarget = null;
let selLoc = { name: '', lat: null, lng: null };
let trRows = [];
let trIdx = 0;
let acTimers = {};
let mapTimer = null;
let fareResult = null; // { fare, km, desc }
let depCoord = null;   // { lat, lng }
let dstCoord = null;

const TRANSPORT = {
  bus:    { label: '버스',     cat: '대중교통비' },
  subway: { label: '지하철',   cat: '대중교통비' },
  ktx:    { label: 'KTX/기차', cat: '대중교통비' },
  ship:   { label: '선박',     cat: '대중교통비' },
  car:    { label: '자가용',   cat: '자가운임'   },
  taxi:   { label: '택시',     cat: '택시비'     },
  plane:  { label: '항공기',   cat: '항공운임'   },
};

document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
addTrRow();

document.addEventListener('click', e => {
  if (!e.target.closest('.ac-wrap')) {
    document.querySelectorAll('.ac-list').forEach(el => el.innerHTML = '');
  }
});

/* ═══════════════════════════════════════
   장소 자동완성 — 카카오 우선, 폴백: Nominatim
═══════════════════════════════════════ */
function acSearch(input, key) {
  clearTimeout(acTimers[key]);
  const q = input.value.trim();
  const el = document.getElementById('ac-' + key);
  if (q.length < 2) { el.innerHTML = ''; return; }

  acTimers[key] = setTimeout(() => {
    if (kakaoReady && kakaoPS) {
      kakaoPS.keywordSearch(q, (data, status) => {
        if (status !== kakao.maps.services.Status.OK) { el.innerHTML = ''; return; }
        el.innerHTML = data.slice(0,6).map(p => `
          <div class="ac-item" onclick="pickAcKakao('${key}','${esc(p.place_name)}',${p.y},${p.x})">
            <div class="main">📍 ${p.place_name}</div>
            <div class="sub">${p.road_address_name || p.address_name}</div>
          </div>`).join('');
      });
    } else {
      // Nominatim fallback
      fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&countrycodes=kr&limit=5&accept-language=ko`)
        .then(r => r.json())
        .then(data => {
          el.innerHTML = data.map(d => {
            const main = d.display_name.split(',')[0];
            const sub  = d.display_name.split(',').slice(1,3).join(',').trim();
            return `<div class="ac-item" onclick="pickAcNom('${key}','${esc(main)}',${d.lat},${d.lon})">
              <div class="main">📍 ${main}</div>
              ${sub ? `<div class="sub">${sub}</div>` : ''}
            </div>`;
          }).join('') || '<div class="ac-item" style="color:#aaa; font-size:12px;">검색 결과 없음</div>';
        }).catch(() => { el.innerHTML = ''; });
    }
  }, 350);
}

function pickAcKakao(key, name, lat, lng) {
  document.getElementById('f-' + key).value = name;
  document.getElementById('ac-' + key).innerHTML = '';
  if (key === 'dep') depCoord = { lat: parseFloat(lat), lng: parseFloat(lng) };
  if (key === 'dst') dstCoord = { lat: parseFloat(lat), lng: parseFloat(lng) };
  tryFareCalc();
}

function pickAcNom(key, name, lat, lng) {
  document.getElementById('f-' + key).value = name;
  document.getElementById('ac-' + key).innerHTML = '';
  if (key === 'dep') depCoord = { lat: parseFloat(lat), lng: parseFloat(lng) };
  if (key === 'dst') dstCoord = { lat: parseFloat(lat), lng: parseFloat(lng) };
  tryFareCalc();
}

/* ═══════════════════════════════════════
   카카오맵 Modal
═══════════════════════════════════════ */
function openMap(target) {
  mapTarget = target;
  selLoc = { name: '', lat: null, lng: null };
  document.getElementById('map-title').textContent = target === 'dep' ? '출발지 선택' : '출장지 선택';
  document.getElementById('sel-name').textContent  = '장소를 검색하거나 지도를 클릭하세요';
  document.getElementById('map-input').value = '';
  document.getElementById('map-results').innerHTML = '';
  document.getElementById('map-modal').classList.add('open');

  // 모달이 DOM에 표시된 뒤 지도 렌더링
  setTimeout(() => {
    const container = document.getElementById('kakao-map');

    if (!kakaoReady) {
      // 아직 SDK 미준비 → 한 번 더 시도
      initKakao();
    }

    if (kakaoReady) {
      if (!kakaoMap) {
        kakaoMap = new kakao.maps.Map(container, {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 5
        });
        kakao.maps.event.addListener(kakaoMap, 'click', e => {
          placeKakaoPin(e.latLng.getLat(), e.latLng.getLng(), null);
        });
      } else {
        kakaoMap.relayout();
      }
      // 현재 필드 값으로 초기 검색
      const cur = document.getElementById('f-' + target).value;
      if (cur) { document.getElementById('map-input').value = cur; mapSearch(cur); }
    } else {
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;
          background:#f5f5f5;flex-direction:column;gap:10px;color:#888;font-size:13px;">
          <div style="font-size:40px;">🗺️</div>
          <div>카카오맵을 불러오는 중입니다...</div>
          <div style="font-size:11px;">인터넷 연결을 확인하거나 카카오 개발자 콘솔에서<br>
          <b>플랫폼 → Web</b>에 현재 주소를 등록해 주세요.</div>
        </div>`;
    }
  }, 200);
}

function closeMap() { document.getElementById('map-modal').classList.remove('open'); }

function placeKakaoPin(lat, lng, name) {
  if (kakaoMap) {
    if (kakaoMarker) kakaoMarker.setMap(null);
    kakaoMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: kakaoMap });
    kakaoMap.setCenter(new kakao.maps.LatLng(lat, lng));
    kakaoMap.setLevel(4);
  }
  selLoc = { lat, lng, name: name || '' };
  if (!name && kakaoReady && kakaoGeocoder) {
    kakaoGeocoder.coord2Address(lng, lat, (result, status) => {
      if (status === kakao.maps.services.Status.OK) {
        const addr = result[0].road_address?.building_name || result[0].road_address?.address_name || result[0].address.address_name;
        selLoc.name = addr;
        document.getElementById('sel-name').textContent = addr;
      }
    });
  } else if (name) {
    document.getElementById('sel-name').textContent = name;
  }
}

function mapSearch(q) {
  clearTimeout(mapTimer);
  const el = document.getElementById('map-results');
  if (!q || q.trim().length < 2) { el.innerHTML = ''; return; }

  mapTimer = setTimeout(() => {
    if (kakaoReady && kakaoPS) {
      kakaoPS.keywordSearch(q, (data, status) => {
        if (status !== kakao.maps.services.Status.OK) { el.innerHTML = '<div style="padding:8px;font-size:12px;color:#aaa;">검색 결과 없음</div>'; return; }
        el.innerHTML = data.slice(0,5).map(p => `
          <div class="map-result-item" onclick="selectMapPlace('${esc(p.place_name)}',${p.y},${p.x})">
            <div class="place-name">📍 ${p.place_name}</div>
            <div class="place-addr">${p.road_address_name || p.address_name}</div>
          </div>`).join('');
      });
    } else {
      fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&countrycodes=kr&limit=5&accept-language=ko`)
        .then(r => r.json())
        .then(data => {
          el.innerHTML = data.map(d => {
            const name = d.display_name.split(',')[0];
            return `<div class="map-result-item" onclick="selectMapPlace('${esc(name)}',${d.lat},${d.lon})">
              <div class="place-name">📍 ${name}</div>
              <div class="place-addr">${d.display_name.split(',').slice(1,3).join(',').trim()}</div>
            </div>`;
          }).join('') || '<div style="padding:8px;font-size:12px;color:#aaa;">검색 결과 없음</div>';
        }).catch(() => {});
    }
  }, 350);
}

function selectMapPlace(name, lat, lng) {
  placeKakaoPin(parseFloat(lat), parseFloat(lng), name);
  document.getElementById('map-results').innerHTML = '';
}

function confirmMap() {
  if (selLoc.name) {
    document.getElementById('f-' + mapTarget).value = selLoc.name;
    document.getElementById('ac-' + mapTarget).innerHTML = '';
    if (mapTarget === 'dep') depCoord = { lat: selLoc.lat, lng: selLoc.lng };
    if (mapTarget === 'dst') dstCoord = { lat: selLoc.lat, lng: selLoc.lng };
    tryFareCalc();
  }
  closeMap();
}

/* ═══════════════════════════════════════
   대중교통비 자동 계산
   카카오 모빌리티 API는 별도 유료이므로,
   두 지점 간 직선거리 기반 + 버스 요금표로 추정
═══════════════════════════════════════ */
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 2024년 기준 수도권 대중교통 요금 (기본/거리비례)
function estimateFare(km) {
  // 직선거리 → 실제 이동거리 추정 (곡선계수 1.35)
  const realKm = km * 1.35;

  if (realKm <= 10) {
    // 기본요금 구간 (버스 1550원, 지하철 1550원)
    return { bus: 1550, subway: 1550, desc: `약 ${realKm.toFixed(1)}km (기본요금)` };
  } else if (realKm <= 40) {
    // 5km 초과마다 100원 추가 (수도권 기준)
    const extra = Math.ceil((realKm - 10) / 5) * 100;
    const fare = 1550 + extra;
    return { bus: fare, subway: fare, desc: `약 ${realKm.toFixed(1)}km` };
  } else if (realKm <= 100) {
    // 시외버스 요금 추정 (km당 약 80원)
    const fare = Math.round(realKm * 80 / 100) * 100;
    return { bus: fare, subway: null, desc: `약 ${realKm.toFixed(1)}km (시외)` };
  } else {
    // 장거리 고속버스 추정
    const fare = Math.round(realKm * 70 / 100) * 100;
    return { bus: fare, subway: null, desc: `약 ${realKm.toFixed(1)}km (고속)` };
  }
}

function tryFareCalc() {
  const dep = document.getElementById('f-dep').value.trim();
  const dst = document.getElementById('f-dst').value.trim();
  const resultEl = document.getElementById('fare-result');
  const badgeEl  = document.getElementById('fare-badge');
  const detailEl = document.getElementById('fare-detail');
  const applyBtn = document.getElementById('fare-apply-btn');

  if (!dep || !dst || (!depCoord && !dstCoord)) {
    resultEl.style.display = 'none';
    fareResult = null;
    return;
  }

  // 좌표가 있으면 바로 계산
  if (depCoord && dstCoord) {
    const km = haversineKm(depCoord.lat, depCoord.lng, dstCoord.lat, dstCoord.lng);
    const est = estimateFare(km);
    fareResult = est;
    resultEl.style.display = 'block';
    badgeEl.textContent = `🚌 버스 예상 ${est.bus.toLocaleString()}원`;
    detailEl.textContent = est.desc;
    applyBtn.style.display = 'inline-block';
    return;
  }

  // 좌표 없으면 카카오/Nominatim으로 지오코딩 후 계산
  resultEl.style.display = 'block';
  badgeEl.textContent = '🔍 경로 계산 중...';
  detailEl.textContent = '';
  applyBtn.style.display = 'none';

  Promise.all([geocode(dep), geocode(dst)]).then(([d, a]) => {
    if (!d || !a) { badgeEl.textContent = '📍 출발지·도착지를 지도에서 선택하면 더 정확합니다'; return; }
    depCoord = d; dstCoord = a;
    const km = haversineKm(d.lat, d.lng, a.lat, a.lng);
    const est = estimateFare(km);
    fareResult = est;
    badgeEl.textContent = `🚌 버스 예상 ${est.bus.toLocaleString()}원`;
    detailEl.textContent = est.desc;
    applyBtn.style.display = 'inline-block';
  }).catch(() => {
    badgeEl.textContent = '계산 불가 — 지도에서 장소를 선택해 주세요';
  });
}

async function geocode(q) {
  if (kakaoReady && kakaoGeocoder) {
    return new Promise(res => {
      kakaoGeocoder.addressSearch(q, (result, status) => {
        if (status === kakao.maps.services.Status.OK)
          return res({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
        // 주소 검색 실패 → 장소 검색
        if (kakaoPS) {
          kakaoPS.keywordSearch(q, (data, st) => {
            if (st === kakao.maps.services.Status.OK)
              res({ lat: parseFloat(data[0].y), lng: parseFloat(data[0].x) });
            else res(null);
          });
        } else res(null);
      });
    });
  } else {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&countrycodes=kr&limit=1`);
      const d = await r.json();
      if (d.length) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
    } catch {}
    return null;
  }
}

// 운임에 계산된 요금 적용
function applyFare() {
  if (!fareResult) return;
  const row = trRows[0];
  if (!row) return;
  row.amt = fareResult.bus;
  row.type = 'bus';
  renderTrRows();
}

/* ═══════════════════════════════════════
   Transport Rows
═══════════════════════════════════════ */
function addTrRow() {
  const id = trIdx++;
  trRows.push({ id, type: 'bus', amt: '', grade: '' });
  renderTrRows();
}

function removeTrRow(id) {
  trRows = trRows.filter(r => r.id !== id);
  renderTrRows();
}

function renderTrRows() {
  document.getElementById('tr-list').innerHTML = trRows.map((row, i) => `
    <div class="tr-row">
      <div class="tr-header">
        <span class="tr-label">운임 ${i+1}</span>
        ${trRows.length > 1 ? `<button class="tr-del" onclick="removeTrRow(${row.id})">×</button>` : ''}
      </div>
      <div class="tr-fields">
        <div class="tr-field">
          <label>교통편</label>
          <select onchange="setTrType(${row.id},this.value)">
            ${Object.entries(TRANSPORT).map(([k,v]) =>
              `<option value="${k}" ${row.type===k?'selected':''}>${v.label}</option>`
            ).join('')}
          </select>
        </div>
        <div class="tr-field">
          <label>금액 (원)</label>
          <input type="number" value="${row.amt||''}" placeholder="0"
            oninput="setTrAmt(${row.id},this.value)">
        </div>
      </div>
      <div class="tr-fields">
        <div class="tr-field">
          <label>내역 (자동)</label>
          <input type="text" value="${TRANSPORT[row.type].cat}" readonly
            style="color:#1a9a9a; font-weight:600; font-size:13px;">
        </div>
        <div class="tr-field">
          <label>등급 (선택)</label>
          <input type="text" value="${row.grade||''}" placeholder="일반/특실 등"
            oninput="setTrGrade(${row.id},this.value)">
        </div>
      </div>
    </div>`).join('');
}

function setTrType(id,v)  { trRows.find(r=>r.id===id).type  = v; renderTrRows(); }
function setTrAmt(id,v)   { trRows.find(r=>r.id===id).amt   = v; }
function setTrGrade(id,v) { trRows.find(r=>r.id===id).grade = v; }

/* ═══════════════════════════════════════

const fmtDate = s => { if(!s) return ''; const d=new Date(s); return `${d.getFullYear()}년 ${String(d.getMonth()+1).padStart(2,'0')}월 ${String(d.getDate()).padStart(2,'0')}일`; };
const fmtShort = s => { if(!s) return ''; const d=new Date(s); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
const fmtMoney = v => (!v||v==0) ? '' : `${parseInt(v).toLocaleString()}원`;
const esc = s => (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
